
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Patients | HealthCare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <a href="/" class="btn btn-outline-secondary mb-4">← Dashboard</a>

    <h2 class="fw-bold">Patients</h2>
    <p class="text-secondary">View your patient records.</p>

    <div class="card border-0 shadow-sm rounded-4 mb-4">
        <div class="card-body p-4">
            <label for="token" class="form-label">JWT Access Token</label>
            <textarea id="token" class="form-control mb-3" rows="3"
                      placeholder="Paste your access token here"></textarea>
            <button id="loadBtn" class="btn btn-primary"
                    onclick="loadPatients()">Load Patients</button>
            <p id="message" class="mt-3 mb-0" role="status"></p>
        </div>
    </div>

    <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-4">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Gender</th>
                        <th>Address</th>
                    </tr>
                    </thead>
                    <tbody id="patientRows">
                    <tr><td colspan="5" class="text-secondary">
                        Load your patients to see records.
                    </td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
async function loadPatients() {
    const token = document.getElementById("token").value.trim();
    const message = document.getElementById("message");
    const rows = document.getElementById("patientRows");
    const button = document.getElementById("loadBtn");

    if (!token) {
        message.textContent = "Please enter your JWT access token.";
        return;
    }

    button.disabled = true;
    message.textContent = "Loading patients...";
    rows.replaceChildren();

    try {
        const response = await fetch("/api/patients/", {
            headers: {
                "Authorization": `Bearer ${token}`
            }
        });

        if (response.status === 401) {
            throw new Error("Token expired or invalid. Please log in again.");
        }

        if (!response.ok) {
            throw new Error(`Request failed (${response.status}).`);
        }

        const patients = await response.json();

        if (patients.length === 0) {
            message.textContent = "No patients found for this account.";
            return;
        }

        patients.forEach(patient => {
            const row = document.createElement("tr");

            [
                patient.id,
                patient.name,
                patient.age,
                patient.gender,
                patient.address
            ].forEach(value => {
                const cell = document.createElement("td");
                cell.textContent = value ?? "";
                row.appendChild(cell);
            });

            rows.appendChild(row);
        });

        message.textContent = `${patients.length} patient(s) loaded successfully.`;
    } catch (error) {
        message.textContent = error.message ||
            "Could not load patients. Check the server and try again.";
    } finally {
        button.disabled = false;
    }
}
</script>
</body>
</html>
