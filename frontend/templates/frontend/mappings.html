
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Patient-Doctor Mappings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Patient-Doctor Mappings</h2>
        <a href="/" class="btn btn-outline-primary">Dashboard</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <label for="token" class="form-label">JWT Access Token</label>
            <textarea id="token" class="form-control mb-3" rows="3"
                placeholder="Paste your access token here"></textarea>

            <button class="btn btn-primary mb-3" onclick="loadMappings()">
                Load Mappings
            </button>

            <p id="message" class="text-danger"></p>

            <div class="table-responsive">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Mapping ID</th>
                            <th>Patient</th>
                            <th>Doctor</th>
                        </tr>
                    </thead>
                    <tbody id="mappingTable"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
async function loadMappings() {
    const token = document.getElementById("token").value.trim();
    const message = document.getElementById("message");
    const table = document.getElementById("mappingTable");

    message.textContent = "";
    table.replaceChildren();

    if (!token) {
        message.textContent = "Please enter your access token.";
        return;
    }

    try {
        const response = await fetch("/api/mappings/", {
            headers: { "Authorization": `Bearer ${token}` }
        });

        const data = await response.json();

        if (!response.ok) {
            message.textContent = data.detail || "Unable to load mappings.";
            return;
        }

        const mappings = Array.isArray(data) ? data : (data.results || []);

        if (mappings.length === 0) {
            message.textContent = "No mappings found.";
            return;
        }

        mappings.forEach(mapping => {
            const row = document.createElement("tr");

            [
                mapping.id,
                mapping.patient_name ?? mapping.patient,
                mapping.doctor_name ?? mapping.doctor
            ].forEach(value => {
                const cell = document.createElement("td");
                cell.textContent = value ?? "";
                row.appendChild(cell);
            });

            table.appendChild(row);
        });
    } catch (error) {
        message.textContent = "Could not connect to the server.";
    }
}
</script>

</body>
</html>
