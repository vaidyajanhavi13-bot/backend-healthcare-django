
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctors | Healthcare Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Doctors</h2>
        <a href="/" class="btn btn-outline-primary">Back to Dashboard</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <label for="token" class="form-label">JWT Access Token</label>
            <textarea id="token" class="form-control mb-3" rows="3"
                placeholder="Paste your access token here"></textarea>

            <button class="btn btn-primary mb-3" onclick="loadDoctors()">
                Load Doctors
            </button>

            <p id="message" class="text-danger"></p>

            <div class="table-responsive">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Specialization</th>
                            <th>Email</th>
                            <th>Phone</th>
                        </tr>
                    </thead>
                    <tbody id="doctorTable"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
async function loadDoctors() {
    const token = document.getElementById("token").value.trim();
    const message = document.getElementById("message");
    const table = document.getElementById("doctorTable");

    message.textContent = "";
    table.replaceChildren();

    if (!token) {
        message.textContent = "Please enter your access token.";
        return;
    }

    try {
        const response = await fetch("/api/doctors/", {
            headers: {
                "Authorization": `Bearer ${token}`
            }
        });

        const data = await response.json();

        if (!response.ok) {
            message.textContent = data.detail || "Unable to load doctors.";
            return;
        }

        const doctors = Array.isArray(data) ? data : (data.results || []);

        if (doctors.length === 0) {
            message.textContent = "No doctors found.";
            return;
        }

        doctors.forEach(doctor => {
            const row = document.createElement("tr");

            [
                doctor.id,
                doctor.name,
                doctor.specialization,
                doctor.email,
                doctor.phone
            ].forEach(value => {
                const cell = document.createElement("td");
                cell.textContent = value ?? "";
                row.appendChild(cell);
            });

            table.appendChild(row);
        });
    } catch (error) {
        message.textContent = "Could not connect to the server.";
    }
}
</script>

</body>
</html>
